[package]
name = "crawler"
version = "0.1.0"
edition = "2021"

[dependencies]
aho-corasick = "1"
async-recursion = "1"
dashmap = "6"
futures = "0.3"
mongodb = "3"
reqwest = { version = "0.13", features = ["json"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
string-replace-all = "0.1"
tokio = { version = "1", features = ["full"] }
url = "2"
fast-robots = "0.1.5"
sitemap = "0.4"

common = {path="../common"}
database_helper = {path="../database"}
