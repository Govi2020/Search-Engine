[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["query"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread"] }
database_helper = { path = "../database" }
common = { path = "../common" }
mongodb = "3"
serde = "1.0.228"
futures = "0.3.33"
tower-http = { version = "0.5", features = ["cors"] }
