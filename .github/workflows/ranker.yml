
name: Run Ranker

on:
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build ranker
        run: cargo build --release -p ranker

      - name: Run crawler
        env:
          MONGO_DB_URL: ${{ vars.MONGO_DB_URL }}
          IS_PROXY : ${{ vars.IS_PROXY }}
        run: cargo run --release -p ranker
